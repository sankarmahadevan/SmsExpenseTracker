name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: SmsExpenseTracker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: true

      - name: Nuke any pre-existing Gradle caches
        run: rm -rf ~/.gradle/caches

      - name: Remove machine-specific local.properties
        run: rm -f local.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --refresh-dependencies

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: SmsExpenseTracker/app/build/outputs/apk/debug/app-debug.apk
